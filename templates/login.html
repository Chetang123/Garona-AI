<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garona AI — Lamp Login</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #020203;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   ROOM
===================================================== */

.room {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #020203;
    overflow: hidden;

    transition: background 1.2s ease;
}


/* =====================================================
   LIGHT AFTER PULL
===================================================== */

.room.light-on {

    background:

        radial-gradient(
            ellipse at 30% 45%,
            rgba(255, 190, 75, .20),
            transparent 35%
        ),

        radial-gradient(
            ellipse at 50% 50%,
            rgba(255, 170, 50, .08),
            transparent 60%
        ),

        #080706;
}


/* =====================================================
   LAMP
===================================================== */

.lamp {
    position: absolute;

    left: 15%;
    top: 22%;

    width: 180px;
    height: 400px;

    transition: transform 1s ease;
}


/* =====================================================
   LAMP SHADE
===================================================== */

.shade {

    position: absolute;

    top: 0;
    left: 20px;

    width: 100px;
    height: 38px;

    border-radius:
        55px 55px 12px 12px;

    background:
        linear-gradient(
            #29292e,
            #101014
        );

    border: 1px solid #35353b;

    z-index: 5;
}


.shade::after {

    content: "";

    position: absolute;

    bottom: -4px;
    left: 8px;

    width: 84px;
    height: 8px;

    border-radius: 50%;

    background: #080809;
}


/* =====================================================
   BULB
===================================================== */

.bulb {

    position: absolute;

    top: 32px;
    left: 68px;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: #111114;

    border: 2px solid #4b302b;

    transition:
        background .8s ease,
        box-shadow .8s ease;
}


.room.light-on .bulb {

    background: #ffe29a;

    border-color: #ffbd5b;

    box-shadow:

        0 0 10px #ffd16a,
        0 0 30px #ffb84d,
        0 0 70px rgba(255,170,55,.9),
        0 0 130px rgba(255,160,40,.5);
}


/* =====================================================
   LAMP STAND
===================================================== */

.stand {

    position: absolute;

    top: 35px;
    left: 77px;

    width: 3px;
    height: 275px;

    background:
        linear-gradient(
            #242429,
            #111114
        );
}


/* =====================================================
   LAMP BASE
===================================================== */

.base {

    position: absolute;

    left: 45px;
    bottom: 40px;

    width: 68px;
    height: 10px;

    border-radius: 50%;

    background: #17171b;

    box-shadow:
        0 4px 10px rgba(0,0,0,.8);
}


/* =====================================================
   LIGHT CONE
===================================================== */

.light-cone {

    position: absolute;

    top: 38px;
    left: 78px;

    width: 10px;
    height: 10px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 1s ease;
}


.room.light-on .light-cone {

    opacity: 1;

    width: 250px;
    height: 300px;

    left: -45px;

    background:

        linear-gradient(
            to bottom,
            rgba(255,205,110,.25),
            rgba(255,180,70,.08),
            transparent
        );

    clip-path:

        polygon(
            48% 0,
            52% 0,
            100% 100%,
            0 100%
        );

    filter: blur(8px);
}


/* =====================================================
   ROPE
===================================================== */

.rope-area {

    position: absolute;

    top: 48px;
    left: 77px;

    width: 60px;
    height: 180px;

    z-index: 20;

    touch-action: none;
}


.rope {

    position: absolute;

    top: 0;
    left: 28px;

    width: 2px;
    height: 70px;

    background: #84786b;

    transform-origin: top;
}


/* =====================================================
   ROPE HANDLE
===================================================== */

.rope-handle {

    position: absolute;

    top: 64px;
    left: 17px;

    width: 24px;
    height: 24px;

    border-radius: 50%;

    border: 4px solid #a75e43;

    background: #111;

    cursor: grab;

    z-index: 30;

    box-shadow:
        0 0 10px rgba(200,100,60,.3);
}


.rope-handle:active {
    cursor: grabbing;
}


.rope-handle::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    background: #ffe7a7;

    border-radius: 50%;

    left: 50%;
    bottom: -7px;

    transform:
        translateX(-50%);
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card {

    position: absolute;

    top: 50%;
    right: 9%;

    width: 380px;

    padding: 32px;

    border-radius: 20px;

    background:
        rgba(30,29,25,.88);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:

        0 30px 80px rgba(0,0,0,.6),

        0 0 50px rgba(255,180,70,.08);

    backdrop-filter:
        blur(18px);

    opacity: 0;

    transform:
        translateY(-50%)
        translateX(100px)
        scale(.92);

    pointer-events: none;

    transition:

        opacity .8s ease,

        transform .9s
        cubic-bezier(.2,.8,.2,1);
}


/* =====================================================
   SHOW LOGIN
===================================================== */

.room.login-visible .login-card {

    opacity: 1;

    transform:
        translateY(-50%)
        translateX(0)
        scale(1);

    pointer-events: auto;
}


/* =====================================================
   LOGIN CONTENT
===================================================== */

.login-card h1 {

    text-align: center;

    font-size: 30px;

    margin-bottom: 8px;
}


.subtitle {

    text-align: center;

    color: #999;

    font-size: 13px;

    margin-bottom: 25px;
}


.input {

    width: 100%;

    height: 45px;

    margin-bottom: 14px;

    padding: 0 14px;

    border-radius: 10px;

    border: 1px solid #38372f;

    background:
        rgba(10,10,8,.7);

    color: white;

    outline: none;
}


.input::placeholder {
    color: #777;
}


.input:focus {
    border-color: #d6a94d;
}


/* =====================================================
   SIGN IN
===================================================== */

.sign-in {

    width: 100%;

    height: 45px;

    border: none;

    border-radius: 10px;

    background: #ffc400;

    color: #17120a;

    font-weight: 700;

    cursor: pointer;

    margin-top: 4px;

    transition: .2s ease;
}


.sign-in:hover {
    background: #ffd02f;
}


.sign-in:disabled {
    opacity: .6;
    cursor: wait;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    min-height: 20px;

    text-align: center;

    font-size: 13px;

    margin-top: 12px;

    color: #ffb4a8;
}


/* =====================================================
   SWITCH LOGIN / SIGNUP
===================================================== */

.switch {

    text-align: center;

    margin-top: 18px;

    font-size: 13px;

    color: #888;
}


.switch button {

    border: none;

    background: none;

    color: #ffc400;

    cursor: pointer;

    font-size: 13px;

    font-weight: 600;
}


.switch button:hover {
    text-decoration: underline;
}


/* =====================================================
   SOCIAL
===================================================== */

.or {

    display: flex;

    align-items: center;

    gap: 10px;

    color: #888;

    font-size: 11px;

    margin: 22px 0;
}


.or::before,
.or::after {

    content: "";

    height: 1px;

    flex: 1;

    background: #444;
}


.social {

    display: flex;

    gap: 12px;
}


.social button {

    flex: 1;

    height: 43px;

    border-radius: 9px;

    border: 1px solid #444;

    background:
        rgba(255,255,255,.06);

    color: white;

    cursor: pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    .lamp {

        left: 18%;

        transform:
            scale(.75);

        transform-origin:
            top left;
    }


    .login-card {

        right: 4%;

        width: 350px;
    }
}


@media(max-width:600px) {

    .lamp {

        left: 50%;

        top: 4%;

        transform:
            translateX(-50%)
            scale(.55);

        transform-origin:
            top center;
    }


    .login-card {

        right: auto;

        left: 50%;

        width:
            calc(100% - 30px);

        max-width: 380px;

        padding: 25px;

        transform:

            translate(-50%, -40%)
            translateY(80px)
            scale(.9);
    }


    .room.login-visible .login-card {

        transform:

            translate(-50%, -50%)
            translateY(0)
            scale(1);
    }

}

</style>
</head>


<body>


<div class="room" id="room">


    <!-- =================================================
         LAMP
    ================================================== -->

    <div class="lamp">

        <div class="shade"></div>

        <div class="bulb"></div>

        <div class="light-cone"></div>

        <div class="stand"></div>

        <div class="base"></div>


        <!-- ROPE -->

        <div
            class="rope-area"
            id="ropeArea">

            <div
                class="rope"
                id="rope">
            </div>

            <button
                type="button"
                class="rope-handle"
                id="ropeHandle">
            </button>

        </div>

    </div>


    <!-- =================================================
         LOGIN CARD
    ================================================== -->

    <div
        class="login-card"
        id="loginCard">


        <h1 id="formTitle">
            Welcome Back
        </h1>


        <p
            class="subtitle"
            id="formSubtitle">

            Enter your details to access your account

        </p>


        <!-- USERNAME -->

        <input
            class="input"
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >


        <!-- EMAIL -->

        <input
            class="input"
            id="email"
            type="email"
            placeholder="Email Address"
            autocomplete="email"
        >


        <!-- PASSWORD -->

        <input
            class="input"
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <!-- SIGN IN -->

        <button
            type="button"
            class="sign-in"
            id="submitButton"
            onclick="login()">

            Sign In

        </button>


        <!-- ERROR / SUCCESS MESSAGE -->

        <div
            class="message"
            id="message">
        </div>


        <!-- SWITCH -->

        <div class="switch">

            <span id="switchText">
                Don't have an account?
            </span>

            <button
                type="button"
                onclick="toggleSignup()"
                id="switchButton">

                Create Account

            </button>

        </div>


        <div class="or">
            OR CONTINUE WITH
        </div>


        <div class="social">

            <button
                type="button"
                onclick="socialLogin('Google')">

                🔵 Google

            </button>


            <button
                type="button"
                onclick="socialLogin('GitHub')">

                ● GitHub

            </button>

        </div>


    </div>


</div>


<script>


/* =====================================================
   ELEMENTS
===================================================== */

const room =
    document.getElementById("room");

const rope =
    document.getElementById("rope");

const handle =
    document.getElementById("ropeHandle");

const usernameInput =
    document.getElementById("username");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const submitButton =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");

const formTitle =
    document.getElementById("formTitle");

const formSubtitle =
    document.getElementById("formSubtitle");

const switchText =
    document.getElementById("switchText");

const switchButton =
    document.getElementById("switchButton");


/* =====================================================
   VARIABLES
===================================================== */

let dragging = false;

let startY = 0;

let pullDistance = 0;

let activated = false;

let signupMode = false;


/* =====================================================
   START PULL
===================================================== */

handle.addEventListener(
    "pointerdown",
    function(e) {

        if (activated)
            return;

        dragging = true;

        startY = e.clientY;

        handle.setPointerCapture(
            e.pointerId
        );

    }
);


/* =====================================================
   DRAG ROPE
===================================================== */

window.addEventListener(
    "pointermove",
    function(e) {

        if (
            !dragging ||
            activated
        )
            return;

        pullDistance =
            e.clientY - startY;


        if (pullDistance < 0)
            pullDistance = 0;


        if (pullDistance > 70)
            pullDistance = 70;


        rope.style.height =
            (70 + pullDistance) + "px";


        handle.style.transform =
            "translateY(" +
            pullDistance +
            "px)";


        if (pullDistance >= 45) {

            activateLamp();

        }

    }
);


/* =====================================================
   RELEASE
===================================================== */

window.addEventListener(
    "pointerup",
    function() {

        if (
            !dragging ||
            activated
        )
            return;

        dragging = false;

        rope.style.transition =
            "height .35s ease";

        handle.style.transition =
            "transform .35s ease";

        rope.style.height =
            "70px";

        handle.style.transform =
            "translateY(0)";


        setTimeout(
            () => {

                rope.style.transition = "";

                handle.style.transition = "";

            },
            400
        );

    }
);


/* =====================================================
   ACTIVATE LAMP
===================================================== */

function activateLamp() {

    if (activated)
        return;

    activated = true;

    dragging = false;


    room.classList.add(
        "light-on"
    );


    setTimeout(
        function() {

            room.classList.add(
                "login-visible"
            );

        },
        650
    );


    rope.style.transition =
        "height .4s ease";

    handle.style.transition =
        "transform .4s ease";

    rope.style.height =
        "70px";

    handle.style.transform =
        "translateY(0)";

}


/* =====================================================
   LOGIN / SIGNUP TOGGLE
===================================================== */

function toggleSignup() {

    signupMode = !signupMode;

    message.textContent = "";

    passwordInput.value = "";

    if (signupMode) {

        formTitle.textContent =
            "Create Account";

        formSubtitle.textContent =
            "Create your Garona AI account";

        submitButton.textContent =
            "Create Account";

        submitButton.onclick =
            signup;

        switchText.textContent =
            "Already have an account?";

        switchButton.textContent =
            "Sign In";

        passwordInput.autocomplete =
            "new-password";

    } else {

        formTitle.textContent =
            "Welcome Back";

        formSubtitle.textContent =
            "Enter your details to access your account";

        submitButton.textContent =
            "Sign In";

        submitButton.onclick =
            login;

        switchText.textContent =
            "Don't have an account?";

        switchButton.textContent =
            "Create Account";

        passwordInput.autocomplete =
            "current-password";
    }

}


/* =====================================================
   SIGN IN
===================================================== */

async function login() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    message.textContent = "";


    if (!email || !password) {

        message.textContent =
            "Please enter your email and password.";

        return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
        "Signing In...";


    try {

        const response =
            await fetch(
                "/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email: email,
                            password: password
                        })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            message.style.color =
                "#9cffb0";

            message.textContent =
                "Login successful...";

            setTimeout(
                function() {

                    window.location.href =
                        data.redirect || "/chat";

                },
                400
            );

        } else {

            message.style.color =
                "#ffb4a8";

            message.textContent =
                data.message ||
                "Invalid email or password.";

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Sign In";
        }


    } catch (error) {

        console.error(error);

        message.style.color =
            "#ffb4a8";

        message.textContent =
            "Could not connect to Garona AI.";

        submitButton.disabled =
            false;

        submitButton.textContent =
            "Sign In";
    }

}


/* =====================================================
   SIGN UP
===================================================== */

async function signup() {

    const username =
        usernameInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    message.textContent = "";


    if (!username || !email || !password) {

        message.textContent =
            "Please fill in all fields.";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
        "Creating Account...";


    try {

        const response =
            await fetch(
                "/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            email:
                                email,

                            password:
                                password

                        })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            message.style.color =
                "#9cffb0";

            message.textContent =
                "Account created...";


            setTimeout(
                function() {

                    window.location.href =
                        data.redirect || "/chat";

                },
                500
            );


        } else {

            message.style.color =
                "#ffb4a8";

            message.textContent =
                data.message ||
                "Could not create account.";

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Create Account";
        }


    } catch (error) {

        console.error(error);

        message.style.color =
            "#ffb4a8";

        message.textContent =
            "Could not connect to Garona AI.";

        submitButton.disabled =
            false;

        submitButton.textContent =
            "Create Account";
    }

}


/* =====================================================
   SOCIAL LOGIN
===================================================== */

function socialLogin(provider) {

    message.style.color =
        "#ffc400";

    message.textContent =
        provider +
        " login is not connected yet.";

}

</script>

</body>
</html>
