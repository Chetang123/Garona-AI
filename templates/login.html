<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garona AI — Lamp Login</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background: #020203;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   ROOM
===================================================== */

.room {

    position: relative;

    width: 100%;
    height: 100vh;

    background: #020203;

    overflow: hidden;

    transition:
        background 1.2s ease;
}


/* LIGHT AFTER PULL */

.room.light-on {

    background:

        radial-gradient(
            ellipse at 30% 45%,
            rgba(255, 190, 75, .20),
            transparent 35%
        ),

        radial-gradient(
            ellipse at 50% 50%,
            rgba(255, 170, 50, .08),
            transparent 60%
        ),

        #080706;
}


/* =====================================================
   LAMP
===================================================== */

.lamp {

    position: absolute;

    left: 15%;

    top: 22%;

    width: 180px;

    height: 400px;

    transition:
        transform 1s ease;
}


/* =====================================================
   LAMP SHADE
===================================================== */

.shade {

    position: absolute;

    top: 0;

    left: 20px;

    width: 100px;

    height: 38px;

    border-radius:
        55px 55px 12px 12px;

    background:

        linear-gradient(
            #29292e,
            #101014
        );

    border:
        1px solid #35353b;

    z-index: 5;
}


/* shade bottom */

.shade::after {

    content: "";

    position: absolute;

    bottom: -4px;

    left: 8px;

    width: 84px;

    height: 8px;

    border-radius: 50%;

    background: #080809;
}


/* =====================================================
   BULB
===================================================== */

.bulb {

    position: absolute;

    top: 32px;

    left: 68px;

    width: 20px;

    height: 20px;

    border-radius: 50%;

    background: #111114;

    border: 2px solid #4b302b;

    transition:

        background .8s ease,

        box-shadow .8s ease;
}


/* BULB ON */

.room.light-on .bulb {

    background: #ffe29a;

    border-color: #ffbd5b;

    box-shadow:

        0 0 10px #ffd16a,

        0 0 30px #ffb84d,

        0 0 70px rgba(255,170,55,.9),

        0 0 130px rgba(255,160,40,.5);
}


/* =====================================================
   LAMP STAND
===================================================== */

.stand {

    position: absolute;

    top: 35px;

    left: 77px;

    width: 3px;

    height: 275px;

    background:

        linear-gradient(
            #242429,
            #111114
        );
}


/* =====================================================
   LAMP BASE
===================================================== */

.base {

    position: absolute;

    left: 45px;

    bottom: 40px;

    width: 68px;

    height: 10px;

    border-radius: 50%;

    background: #17171b;

    box-shadow:
        0 4px 10px rgba(0,0,0,.8);
}


/* =====================================================
   LIGHT CONE
===================================================== */

.light-cone {

    position: absolute;

    top: 38px;

    left: 78px;

    width: 10px;

    height: 10px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 1s ease;
}


/* triangle light */

.room.light-on .light-cone {

    opacity: 1;

    width: 250px;

    height: 300px;

    left: -45px;

    background:

        linear-gradient(
            to bottom,
            rgba(255,205,110,.25),
            rgba(255,180,70,.08),
            transparent
        );

    clip-path:

        polygon(
            48% 0,
            52% 0,
            100% 100%,
            0 100%
        );

    filter: blur(8px);

}


/* =====================================================
   ROPE
===================================================== */

.rope-area {

    position: absolute;

    top: 48px;

    left: 77px;

    width: 60px;

    height: 180px;

    z-index: 20;

    touch-action: none;
}


.rope {

    position: absolute;

    top: 0;

    left: 28px;

    width: 2px;

    height: 70px;

    background: #84786b;

    transform-origin: top;
}


/* =====================================================
   ROPE HANDLE
===================================================== */

.rope-handle {

    position: absolute;

    top: 64px;

    left: 17px;

    width: 24px;

    height: 24px;

    border-radius: 50%;

    border:

        4px solid #a75e43;

    background: #111;

    cursor: grab;

    z-index: 30;

    box-shadow:
        0 0 10px rgba(200,100,60,.3);
}


.rope-handle:active {

    cursor: grabbing;
}


/* little white/yellow end */

.rope-handle::after {

    content: "";

    position: absolute;

    width: 5px;

    height: 5px;

    background: #ffe7a7;

    border-radius: 50%;

    left: 50%;

    bottom: -7px;

    transform:
        translateX(-50%);
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card {

    position: absolute;

    top: 50%;

    right: 9%;

    width: 380px;

    padding: 32px;

    border-radius: 20px;

    background:

        rgba(30,29,25,.88);

    border:

        1px solid
        rgba(255,255,255,.12);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,.6),

        0 0 50px
        rgba(255,180,70,.08);

    backdrop-filter:
        blur(18px);

    /* HIDDEN */

    opacity: 0;

    transform:
        translateY(-50%)
        translateX(100px)
        scale(.92);

    pointer-events: none;

    transition:

        opacity .8s ease,

        transform .9s
        cubic-bezier(.2,.8,.2,1);
}


/* =====================================================
   SHOW LOGIN AFTER PULL
===================================================== */

.room.login-visible .login-card {

    opacity: 1;

    transform:
        translateY(-50%)
        translateX(0)
        scale(1);

    pointer-events: auto;
}


/* =====================================================
   LOGIN CONTENT
===================================================== */

.login-card h1 {

    text-align: center;

    font-size: 30px;

    margin-bottom: 8px;
}


.subtitle {

    text-align: center;

    color: #999;

    font-size: 13px;

    margin-bottom: 25px;
}


.input {

    width: 100%;

    height: 45px;

    margin-bottom: 14px;

    padding: 0 14px;

    border-radius: 10px;

    border:
        1px solid #38372f;

    background:
        rgba(10,10,8,.7);

    color: white;

    outline: none;
}


.input:focus {

    border-color:
        #d6a94d;
}


/* =====================================================
   SIGN IN
===================================================== */

.sign-in {

    width: 100%;

    height: 45px;

    border: none;

    border-radius: 10px;

    background:
        #ffc400;

    color: #17120a;

    font-weight: 700;

    cursor: pointer;

    margin-top: 4px;
}


.sign-in:hover {

    background:
        #ffd02f;
}


/* =====================================================
   SOCIAL
===================================================== */

.or {

    display: flex;

    align-items: center;

    gap: 10px;

    color: #888;

    font-size: 11px;

    margin: 22px 0;
}


.or::before,
.or::after {

    content: "";

    height: 1px;

    flex: 1;

    background: #444;
}


.social {

    display: flex;

    gap: 12px;
}


.social button {

    flex: 1;

    height: 43px;

    border-radius: 9px;

    border:
        1px solid #444;

    background:
        rgba(255,255,255,.06);

    color: white;

    cursor: pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    .lamp {

        left: 18%;

        transform:
            scale(.75);

        transform-origin:
            top left;
    }


    .login-card {

        right: 4%;

        width: 350px;
    }
}


@media(max-width:600px) {

    .lamp {

        left: 50%;

        top: 4%;

        transform:
            translateX(-50%)
            scale(.55);

        transform-origin:
            top center;
    }


    .login-card {

        right: auto;

        left: 50%;

        width:
            calc(100% - 30px);

        max-width: 380px;

        padding: 25px;

        transform:

            translate(-50%, -40%)
            translateY(80px)
            scale(.9);
    }


    .room.login-visible
    .login-card {

        transform:

            translate(-50%, -50%)
            translateY(0)
            scale(1);
    }

}

</style>
</head>


<body>


<div
    class="room"
    id="room">


    <!-- =================================================
         LAMP
    ================================================== -->

    <div class="lamp">


        <div class="shade"></div>


        <div class="bulb"></div>


        <div class="light-cone"></div>


        <div class="stand"></div>


        <div class="base"></div>


        <!-- ROPE -->

        <div
            class="rope-area"
            id="ropeArea">


            <div
                class="rope"
                id="rope">
            </div>


            <button
                class="rope-handle"
                id="ropeHandle">
            </button>


        </div>


    </div>



    <!-- =================================================
         LOGIN
    ================================================== -->

    <div
        class="login-card"
        id="loginCard">


        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">
            Enter your details to access your account
        </p>


        <input
            class="input"
            type="text"
            placeholder="Username">


        <input
            class="input"
            type="email"
            placeholder="Email Address">


        <input
            class="input"
            type="password"
            placeholder="Password">


        <button
            class="sign-in"
            onclick="login()">

            Sign In

        </button>


        <div class="or">
            OR CONTINUE WITH
        </div>


        <div class="social">

            <button
                onclick="socialLogin('Google')">

                🔵 Google

            </button>


            <button
                onclick="socialLogin('GitHub')">

                ● GitHub

            </button>

        </div>


    </div>


</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const room =
    document.getElementById("room");

const rope =
    document.getElementById("rope");

const handle =
    document.getElementById("ropeHandle");


/* =====================================================
   VARIABLES
===================================================== */

let dragging = false;

let startY = 0;

let pullDistance = 0;

let activated = false;


/* =====================================================
   START PULL
===================================================== */

handle.addEventListener(
    "pointerdown",
    function(e) {

        if (activated)
            return;


        dragging = true;

        startY =
            e.clientY;

        handle.setPointerCapture(
            e.pointerId
        );

    }
);


/* =====================================================
   DRAG ROPE
===================================================== */

window.addEventListener(
    "pointermove",
    function(e) {

        if (
            !dragging ||
            activated
        )
            return;


        pullDistance =
            e.clientY - startY;


        if (
            pullDistance < 0
        )
            pullDistance = 0;


        if (
            pullDistance > 70
        )
            pullDistance = 70;


        /*
           Stretch rope
        */

        rope.style.height =
            (70 + pullDistance)
            + "px";


        /*
           Move handle
        */

        handle.style.transform =
            "translateY(" +
            pullDistance +
            "px)";


        /*
           Trigger after
           sufficient pull
        */

        if (
            pullDistance >= 45
        ) {

            activateLamp();

        }

    }
);


/* =====================================================
   RELEASE
===================================================== */

window.addEventListener(
    "pointerup",
    function() {

        if (
            !dragging ||
            activated
        )
            return;


        dragging = false;


        rope.style.transition =
            "height .35s ease";


        handle.style.transition =
            "transform .35s ease";


        rope.style.height =
            "70px";


        handle.style.transform =
            "translateY(0)";


        setTimeout(
            () => {

                rope.style.transition =
                    "";

                handle.style.transition =
                    "";

            },
            400
        );

    }
);


/* =====================================================
   ACTIVATE LAMP
===================================================== */

function activateLamp() {

    if (activated)
        return;


    activated = true;

    dragging = false;


    /*
       Lamp turns ON
    */

    room.classList.add(
        "light-on"
    );


    /*
       Login appears
       AFTER lamp lights
    */

    setTimeout(
        function() {

            room.classList.add(
                "login-visible"
            );

        },
        650
    );


    /*
       Return rope
    */

    rope.style.transition =
        "height .4s ease";


    handle.style.transition =
        "transform .4s ease";


    rope.style.height =
        "70px";


    handle.style.transform =
        "translateY(0)";

}


/* =====================================================
   LOGIN
===================================================== */

function login() {

    alert(
        "Connect your Garona AI authentication here."
    );

    /*
       If your existing backend uses:

       window.location.href = "/chat";

       you can put it here.
    */

}


/* =====================================================
   SOCIAL LOGIN
===================================================== */

function socialLogin(provider) {

    alert(
        provider +
        " login will be connected later."
    );

}

</script>

</body>
</html>
